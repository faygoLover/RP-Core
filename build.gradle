plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArg '-Dfile.encoding=UTF-8'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            if (project.hasProperty('quickplay')) args '--quickPlayMultiplayer', project.property('quickplay')
            if (project.hasProperty('username')) args '--username', project.property('username')
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Проверка загрузки (мод + RP Core без остальных): ./gradlew runGameTestServer — сервер стартует и выходит.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    // JEI — только API для компиляции (замок семейства прячет предметы и из JEI); в игре необязателен.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    // FL Render — общая графика (обязательна у игроков); jar в libs/ (в git не идёт).
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("blank:flrender:${flrender_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    // Позы /sit и /lay — эмоции Emotecraft (необязателен: без него позы без анимации). jar-ы в libs/.
    compileOnly files('libs/emotecraft-for-MC1.20.1-2.2.7-b.build.50-forge.jar', 'libs/player-animation-lib-forge-1.0.2-rc1+1.20.jar')
}

// Замок семейства (только локальная сборка). Если рядом лежит lock.local.properties (он в .gitignore), в jar кладётся
// rpcore_lock.properties с солью и хэшем пароля (PBKDF2) — тогда предметы RP-модов скрыты из креатива и JEI, пока
// у игрока нет ключа (config/rpcore-client.toml → [access] key) или прав ведущего на сервере. Пароль в jar не попадает.
def lockSrc = file('lock.local.properties')
def generateRpLock = tasks.register('generateRpLock') {
    def outDir = layout.buildDirectory.dir('generated/rplock')
    inputs.files(lockSrc)
    outputs.dir(outDir)
    doLast {
        def dir = outDir.get().asFile
        project.delete(dir)
        dir.mkdirs()
        if (!lockSrc.exists()) return
        def p = new Properties()
        lockSrc.withReader('UTF-8') { p.load(it) }
        def password = p.getProperty('password', '').trim()
        if (password.isEmpty()) throw new GradleException('lock.local.properties: пустой password')
        def salt = p.getProperty('salt', 'rp-family').trim()
        int iterations = 100000
        def spec = new javax.crypto.spec.PBEKeySpec(password.toCharArray(), salt.getBytes('UTF-8'), iterations, 256)
        def hash = javax.crypto.SecretKeyFactory.getInstance('PBKDF2WithHmacSHA256').generateSecret(spec).encoded.encodeHex().toString()
        def lines = ["salt=${salt}", "hash=${hash}", "iterations=${iterations}"]
        if (p.getProperty('namespaces')) lines << "namespaces=${p.getProperty('namespaces').trim()}"
        new File(dir, 'rpcore_lock.properties').setText(lines.join('\n') + '\n', 'UTF-8')
        logger.lifecycle('RP Core: замок включён')
    }
}

tasks.named('processResources', ProcessResources).configure {
    from(generateRpLock)
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
